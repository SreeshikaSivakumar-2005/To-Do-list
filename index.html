<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow — Smart To-Do List</title>
  <meta name="description" content="TaskFlow is a fast, private to-do list that tracks priorities, categories and deadlines. Everything is saved in your browser.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Font is optional: if it cannot load, the system font stack in style.css is used. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Apply the saved theme before the page paints, so there is no light/dark flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('taskflow.theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to tasks</a>

  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img src="assets/favicon.svg" alt="" width="34" height="34">
        <span class="brand__name">TaskFlow</span>
        <button type="button" class="icon-btn icon-btn--on-dark sidebar__close" id="closeMenuBtn" aria-label="Close menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <nav class="nav" aria-label="Task views">
        <h2 class="nav__heading">Views</h2>
        <button type="button" class="nav__item" data-view="all" aria-pressed="true">
          <span>All tasks</span><span class="nav__count" data-count="all">0</span>
        </button>
        <button type="button" class="nav__item" data-view="active" aria-pressed="false">
          <span>Active</span><span class="nav__count" data-count="active">0</span>
        </button>
        <button type="button" class="nav__item" data-view="completed" aria-pressed="false">
          <span>Completed</span><span class="nav__count" data-count="completed">0</span>
        </button>
        <button type="button" class="nav__item nav__item--danger" data-view="overdue" aria-pressed="false">
          <span>Overdue</span><span class="nav__count" data-count="overdue">0</span>
        </button>
      </nav>

      <div class="manage">
        <h2 class="nav__heading">Manage</h2>
        <button type="button" class="manage__btn" id="themeToggle" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="themeToggleLabel">Dark mode</span>
        </button>
        <button type="button" class="manage__btn" id="clearCompletedBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
          <span>Clear completed</span>
        </button>
        <button type="button" class="manage__btn" id="removeSamplesBtn" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
          <span>Remove sample tasks</span>
        </button>
        <button type="button" class="manage__btn manage__btn--danger" id="deleteAllBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
          <span>Delete all tasks</span>
        </button>
      </div>

      <p class="sidebar__note">Saved in this browser only. It does not sync between devices.</p>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- ============ MAIN ============ -->
    <main class="main" id="main" tabindex="-1">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="openMenuBtn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar__title">
          <h1>Your tasks</h1>
          <p id="todayLabel" class="muted"></p>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label for="searchInput" class="visually-hidden">Search tasks by title or description</label>
          <input type="search" id="searchInput" placeholder="Search tasks" autocomplete="off" maxlength="100">
        </div>
        <button type="button" class="btn btn--primary" id="addTaskBtn" aria-label="Add new task">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>New task</span>
        </button>
      </header>

      <!-- Overview: progress + statistics -->
      <section class="overview" aria-labelledby="overviewTitle">
        <h2 id="overviewTitle" class="visually-hidden">Overview</h2>
        <div class="progress">
          <div class="progress__head">
            <span class="progress__percent" id="percentText">0%</span>
            <span class="progress__label" id="progressLabel">of your tasks are done</span>
          </div>
          <div class="progress__track" role="progressbar" aria-label="Completion progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
            <div class="progress__fill" id="progressFill"></div>
          </div>
        </div>
        <dl class="stats">
          <div class="stat"><dt>Total</dt><dd id="statTotal">0</dd></div>
          <div class="stat"><dt>Pending</dt><dd id="statPending">0</dd></div>
          <div class="stat"><dt>Completed</dt><dd id="statCompleted">0</dd></div>
          <div class="stat stat--danger"><dt>Overdue</dt><dd id="statOverdue">0</dd></div>
        </dl>
      </section>

      <!-- Filters shown as tabs on small screens (the sidebar is hidden there) -->
      <div class="tabs" role="group" aria-label="Task views">
        <button type="button" data-view="all" aria-pressed="true">All</button>
        <button type="button" data-view="active" aria-pressed="false">Active</button>
        <button type="button" data-view="completed" aria-pressed="false">Done</button>
        <button type="button" data-view="overdue" aria-pressed="false">Overdue</button>
      </div>

      <section class="toolbar" aria-label="Filter and sort">
        <div class="field-inline">
          <label for="priorityFilter">Priority</label>
          <select id="priorityFilter">
            <option value="all">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="field-inline">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter">
            <option value="all">All categories</option>
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Shopping">Shopping</option>
          </select>
        </div>
        <div class="field-inline">
          <label for="sortSelect">Sort by</label>
          <select id="sortSelect">
            <option value="created">Newest first</option>
            <option value="due">Due date</option>
            <option value="priority">Priority</option>
            <option value="alpha">A to Z</option>
          </select>
        </div>
        <button type="button" class="btn btn--ghost" id="resetFiltersBtn">Reset filters</button>
      </section>

      <p class="result-count muted" id="resultCount" aria-live="polite"></p>

      <section aria-label="Task list">
        <ul class="task-list" id="taskList"></ul>
        <div class="empty" id="emptyState" hidden>
          <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="8" width="40" height="48" rx="6"/><path d="M22 22h20M22 32h20M22 42h11"/></svg>
          <h2 id="emptyTitle">No tasks yet</h2>
          <p id="emptyText">Add your first task to start planning your day.</p>
          <div class="empty__actions" id="emptyActions"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ============ ADD / EDIT DIALOG ============ -->
  <dialog id="taskDialog" aria-labelledby="dialogTitle">
    <form id="taskForm" novalidate>
      <header class="dialog__head">
        <h2 id="dialogTitle">New task</h2>
        <button type="button" class="icon-btn" id="dialogCloseBtn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="dialog__body">
        <div class="field">
          <label for="titleInput">Title <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="titleInput" maxlength="80" required aria-describedby="titleError" placeholder="e.g. Finish project report">
          <p class="field__error" id="titleError" role="alert"></p>
        </div>

        <div class="field">
          <label for="descInput">Description <span class="muted">(optional)</span></label>
          <textarea id="descInput" rows="3" maxlength="300" aria-describedby="descError" placeholder="Add details, links or notes"></textarea>
          <p class="field__error" id="descError" role="alert"></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="priorityInput">Priority</label>
            <select id="priorityInput">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="categoryInput">Category</label>
            <select id="categoryInput">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Shopping">Shopping</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="dueInput">Due date <span class="muted">(optional)</span></label>
          <input type="date" id="dueInput" aria-describedby="dueError">
          <p class="field__error" id="dueError" role="alert"></p>
        </div>
      </div>

      <footer class="dialog__foot">
        <button type="button" class="btn btn--ghost" id="dialogCancelBtn">Cancel</button>
        <button type="submit" class="btn btn--primary" id="saveTaskBtn">Add task</button>
      </footer>
    </form>
  </dialog>

  <!-- ============ CONFIRM DIALOG ============ -->
  <dialog id="confirmDialog" class="dialog--small" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <div class="dialog__body">
      <h2 id="confirmTitle">Are you sure?</h2>
      <p id="confirmText" class="muted"></p>
    </div>
    <footer class="dialog__foot">
      <button type="button" class="btn btn--ghost" id="confirmCancelBtn">Cancel</button>
      <button type="button" class="btn btn--danger" id="confirmOkBtn">Delete</button>
    </footer>
  </dialog>

  <!-- Toast notifications -->
  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <p class="noscript">TaskFlow needs JavaScript to run. Please enable it in your browser.</p>
  </noscript>
</body>
</html>
